FROM python:3.12-alpine
# Set working directory
WORKDIR /app
# Copy requirements.txt first to leverage Docker cache
COPY requirements.txt .
# Install Dependencies
RUN pip install --no-cache-dir -r requirements.txt
# Copy the serializers submodule and generate the protobuf modules of the query protocol
COPY ./external /app/external
RUN mkdir -p /app/.generated && \
    python -m grpc_tools.protoc -I external/serializer/proto --python_out=.generated \
    $(find external/serializer/proto -name '*.proto')
# Copy source code to working directory
COPY ./src /app/src

# Bidirectionally mount cache directory to persist downloaded .proto files across container runs
# VOLUME /app/cache

ENTRYPOINT ["python", "-m", "src.main", "config.json"]
