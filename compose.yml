services:
    cache-init:
        container_name: cache-initializer
        hostname: cache-initializer
        image: busybox:1.36
        user: "0:0"
        volumes:
            - ./cache:/cache:rw
        command: ["sh", "-c", "chown -R 1000:1000 /cache"]
        restart: "no"

    influx-logger:
        container_name: influx-logger
        hostname: influx-logger
        build:
            context: .
            dockerfile: Dockerfile.influx-logger.yml
        user: "1000:1000"
        depends_on:
            cache-init:
                condition: service_completed_successfully
        init: true
        cap_drop:
            - ALL
        security_opt:
            - no-new-privileges:true
        volumes:
            - ./config.json:/app/config.json:ro
            - ./cache:/app/cache:rw
        networks:
            - default
        restart: unless-stopped

    influxdb2:
        container_name: influxdb2
        hostname: influxdb
        image: influxdb:2
        ports:
            - "8086:8086"
        env_file:
            - ./.env.influxdb2
        volumes:
            - type: volume
              source: influxdb2-data
              target: /var/lib/influxdb2
            - type: volume
              source: influxdb2-config
              target: /etc/influxdb2
        networks:
            - default

secrets:
    influxdb2-admin-username:
        file: ./.env.influxdb2-admin-username
    influxdb2-admin-password:
        file: ./.env.influxdb2-admin-password
    influxdb2-admin-token:
        file: ./.env.influxdb2-admin-token
    logger-config:
        file: ./config.json

volumes:
    influxdb2-data:
        driver: local
    influxdb2-config:
        driver: local

networks:
    default:
        driver: bridge
